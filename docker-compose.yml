# Local development database only. Do not use these credentials in production.
services:
  db:
    image: postgres:16-alpine
    container_name: vaultx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultx
      POSTGRES_PASSWORD: vaultx_dev_password
      POSTGRES_DB: vaultx
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - vaultx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultx -d vaultx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultx-db-data:
